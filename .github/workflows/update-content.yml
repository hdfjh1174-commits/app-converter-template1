name: Update App Content

on:
  push:
    paths:
      - '*.zip'

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  update-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update -y && sudo apt-get install -y imagemagick

      - name: Find uploaded zip (ignore project.zip)
        id: findzip
        run: |
          ZIPFILE=$(ls *.zip 2>/dev/null | grep -v '^project\.zip$' | head -n 1 || true)
          if [ -z "$ZIPFILE" ]; then
            echo "لا يوجد ملف مضغوط جديد للمعالجة، تخطي."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "zipname=$ZIPFILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace assets with uploaded zip content
        if: steps.findzip.outputs.found == 'true'
        run: |
          ZIPFILE="${{ steps.findzip.outputs.zipname }}"
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          unzip -o "$ZIPFILE" -d _newcontent

          SRC=_newcontent
          if [ "$(ls _newcontent | wc -l)" -eq 1 ] && [ -d "_newcontent/$(ls _newcontent)" ]; then
            SRC="_newcontent/$(ls _newcontent)"
          fi

          if [ -f "$SRC/icon.png" ]; then
            declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
            for density in "${!SIZES[@]}"; do
              size="${SIZES[$density]}"
              mkdir -p "app/src/main/res/mipmap-$density"
              convert "$SRC/icon.png" -resize ${size}x${size} "app/src/main/res/mipmap-$density/ic_launcher.png"
              convert "$SRC/icon.png" -resize ${size}x${size} "app/src/main/res/mipmap-$density/ic_launcher_round.png"
            done
            rm -f "$SRC/icon.png"
            echo "تم تحديث الأيقونة بكل المقاسات من icon.png"
          fi

          cp -r "$SRC/." app/src/main/assets/

          rm -rf _newcontent
          rm -f "$ZIPFILE"

          if [ ! -f app/src/main/assets/index.html ]; then
            echo "تحذير: index.html غير موجود في الملف المرفوع!"
            exit 1
          fi

      - name: Commit updated content
        if: steps.findzip.outputs.found == 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          git commit -m "Update app content from ${{ steps.findzip.outputs.zipname }}" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
