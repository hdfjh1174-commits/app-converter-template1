name: Build App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'اسم التطبيق (يظهر تحت الأيقونة)'
        required: true
        default: 'تطبيقي'
      package_name:
        description: 'معرّف الحزمة (مثال: com.mycompany.myapp)'
        required: true
        default: 'com.converter.app'
      target_url:
        description: 'رابط الموقع (اتركه فارغًا لاستخدام الملفات المحلية في assets/)'
        required: false
        default: ''
      enable_camera:
        description: 'تفعيل صلاحية الكاميرا؟'
        required: true
        type: boolean
        default: false
      enable_location:
        description: 'تفعيل صلاحية الموقع الجغرافي؟'
        required: true
        type: boolean
        default: false
      enable_microphone:
        description: 'تفعيل صلاحية الميكروفون؟'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply settings from the form
        run: |
          # App name
          sed -i "s#<string name=\"app_name\">.*</string>#<string name=\"app_name\">${{ inputs.app_name }}</string>#" app/src/main/res/values/strings.xml
          # Target URL
          sed -i "s#<string name=\"target_url\">.*</string>#<string name=\"target_url\">${{ inputs.target_url }}</string>#" app/src/main/res/values/strings.xml
          # Package name / applicationId
          sed -i "s#namespace = \".*\"#namespace = \"${{ inputs.package_name }}\"#" app/build.gradle.kts
          sed -i "s#applicationId = \".*\"#applicationId = \"${{ inputs.package_name }}\"#" app/build.gradle.kts
          # Permission flags
          sed -i "s#<bool name=\"enable_camera\">.*</bool>#<bool name=\"enable_camera\">${{ inputs.enable_camera }}</bool>#" app/src/main/res/values/config.xml
          sed -i "s#<bool name=\"enable_location\">.*</bool>#<bool name=\"enable_location\">${{ inputs.enable_location }}</bool>#" app/src/main/res/values/config.xml
          sed -i "s#<bool name=\"enable_microphone\">.*</bool>#<bool name=\"enable_microphone\">${{ inputs.enable_microphone }}</bool>#" app/src/main/res/values/config.xml
          echo "---- strings.xml ----"; cat app/src/main/res/values/strings.xml
          echo "---- config.xml ----"; cat app/src/main/res/values/config.xml
          echo "---- build.gradle.kts ----"; cat app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ inputs.app_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
